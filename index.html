<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121212"><title>Zaks Music</title><style>*{box-sizing:border-box}body{margin:0;background:#121212;color:#fff;font-family:Arial,sans-serif;padding-bottom:105px}.top{position:sticky;top:0;z-index:5;background:#121212;padding:14px;display:flex;gap:10px;align-items:center}.logo{background:#ff7900;color:#111;font-weight:bold;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:22px}.search{flex:1;background:#242424;border:1px solid #333;border-radius:24px;padding:11px 15px;color:#fff;outline:0}.btn,.tab{background:#242424;color:#fff;border:0;border-radius:22px;padding:10px 14px}.tabs{display:flex;gap:8px;padding:0 14px 16px}.tab.active,.play{background:#ff7900;color:#111;font-weight:bold}.hero{margin:0 14px 22px;padding:25px 20px;border-radius:18px;background:linear-gradient(135deg,#32200f,#242424)}.hero small{color:#ff9a45;font-weight:bold}.hero h1{font-size:30px;margin:8px 0}.hero p{color:#aaa}.section{padding:0 14px;margin-bottom:24px}.head{display:flex;justify-content:space-between;margin-bottom:12px}.head h2{margin:0}.count{color:#888;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#1c1c1c;padding:10px;border-radius:14px}.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.title{font-weight:bold;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:#999;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.fav{background:none;color:#aaa;font-size:20px}.fav.on{color:#ff7900}.play{width:38px;height:38px;border:0;border-radius:50%}.recent{display:flex;flex-direction:column;gap:8px}.row{display:flex;align-items:center;gap:10px;background:#1b1b1b;padding:8px;border-radius:10px}.row img{width:52px;height:52px;object-fit:cover;border-radius:7px}.info{flex:1;min-width:0}.row button{background:#292929;color:#fff;border:0;border-radius:50%;width:36px;height:36px}.empty{text-align:center;color:#777;padding:25px}.player{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#181818;border-top:1px solid #333;padding:9px 12px}.pmain{display:flex;align-items:center;gap:9px}.pcover{width:48px;height:48px;object-fit:cover;border-radius:7px;background:#292929}.pinfo{flex:1;min-width:0}.ptitle{font-size:14px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.partist{font-size:12px;color:#999;margin-top:3px}.controls{display:flex;gap:3px}.controls button{background:none;color:#fff;border:0;width:34px;height:34px}.controls .main{background:#fff;color:#111;border-radius:50%}.bar{display:flex;align-items:center;gap:7px}.bar input{flex:1;accent-color:#ff7900}.time{font-size:10px;color:#888;width:30px;text-align:center}.volume{max-width:80px}.lyricsBtn{background:#292929;color:#fff;border:0;border-radius:12px;padding:8px 10px;font-size:12px}.lyricsOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:30;padding:20px;align-items:flex-end;justify-content:center}.lyricsOverlay.show{display:flex}.lyricsBox{width:min(700px,100%);max-height:80vh;background:#1b1b1b;border:1px solid #333;border-radius:20px;padding:18px;overflow:auto}.lyricsHead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:#1b1b1b;padding-bottom:10px}.lyricsTitle{font-size:20px;font-weight:bold}.lyricsText{white-space:pre-wrap;line-height:1.8;color:#ddd;margin-top:10px}.lyricsEdit{width:100%;min-height:240px;background:#111;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;resize:vertical;outline:0}.lyricsActions{display:flex;gap:8px;margin-top:10px}.lyricsActions button{background:#292929;color:#fff;border:0;border-radius:10px;padding:9px 12px}.lyricsActions .save{background:#ff7900;color:#111;font-weight:bold}@media(min-width:700px){body{max-width:1050px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:550px){.volume{display:none}}</style></head><body>
<header class="top"><div class="logo">Z</div><input id="search" class="search" placeholder="Cari musik..."><button class="btn" id="random">🔀</button></header>
<nav class="tabs"><button class="tab active" data-filter="all">Semua</button><button class="tab" data-filter="favorites">Favorit</button><button class="tab" data-filter="playlists">Playlist</button></nav>
<section class="hero"><small>ZAKS MUSIC</small><h1>Musik untuk setiap suasana.</h1><p>Koleksi musik yang memiliki audio siap diputar.</p></section>
<section id="playlistBox" class="section" style="display:none"><div class="head"><h2>Playlist Saya</h2><button class="btn" onclick="createPlaylist()">＋ Buat Playlist</button></div><div id="playlists" class="recent"></div></section>
<section class="section"><div class="head"><h2>Musik Kamu</h2><span class="count" id="count"></span></div><div id="grid" class="grid"></div></section>
<section class="section"><div class="head"><h2>Terakhir Diputar</h2></div><div id="recent" class="recent"></div></section>
<div class="player"><div class="pmain"><img id="pc" class="pcover"><div class="pinfo"><div id="pt" class="ptitle">Pilih musik</div><div id="pa" class="partist">Zaks Music</div></div><button class="lyricsBtn" id="lyricsBtn">🎵 Lirik</button><div class="controls"><button id="prev">⏮</button><button id="play" class="main">▶</button><button id="next">⏭</button></div></div><div class="bar"><span id="cur" class="time">0:00</span><input id="prog" type="range" min="0" max="100" value="0"><span id="dur" class="time">0:00</span><input id="vol" class="volume" type="range" min="0" max="1" step=".01" value="1"></div></div>
<div id="lyricsOverlay" class="lyricsOverlay"><div class="lyricsBox"><div class="lyricsHead"><div><div id="lyricsTitle" class="lyricsTitle">Lirik</div><div id="lyricsArtist" class="artist">Pilih musik</div></div><button class="btn" id="closeLyrics">✕</button></div><div id="lyricsText" class="lyricsText"></div><textarea id="lyricsInput" class="lyricsEdit" style="display:none" placeholder="Tempel lirik yang kamu miliki di sini..."></textarea><div class="lyricsActions"><button id="editLyrics">✏️ Edit lirik</button><button id="cancelLyrics" style="display:none">Batal</button><button id="saveLyrics" class="save" style="display:none">Simpan</button></div></div></div><audio id="audio" preload="metadata"></audio>
<script>
const songs=[
{id:2,title:'Beauty and a Beat',artist:'Justin Bieber ft. Nicki Minaj',album:'Believe',cover:'https://cdn.phototourl.com/member/2026-09-24-86b0cefb-cc23-4b59-b9e7-5a9a5f43293f.jpg',audio:'https://pdftourl.net/audio/1790165787973-23958455-b489-49f8-91b1-8618876c31e6.mp3',lyrics:''},


{id:5,title:'Teh Hijau',artist:'Tulus',album:'Teh Hijau',cover:'https://cdn.phototourl.com/member/2026-09-23-b2fbdc8b-3439-4f16-adc0-c9bbd61afd96.jpg',audio:'https://pdftourl.net/audio/1790169364028-6737d394-ddb5-4300-82f1-2899a90aeae9.mp3',lyrics:''},
{id:6,title:'As It Was',artist:'Harry Styles',album:"Harry's House",cover:'https://cdn.phototourl.com/member/2026-09-24-e71aa6b8-3528-47ab-8ebd-ec8721d43678.jpg',audio:'https://pdftourl.net/audio/1790169279446-6f9f6aa7-80f2-46b7-b878-25164928a0a4.mp3',lyrics:''},
{id:7,title:'On My Way',artist:'Alan Walker',album:'World of Walker',cover:'https://cdn.phototourl.com/member/2026-09-24-1b92461b-4444-48bb-9422-e6291da8ea33.png',audio:'https://pdftourl.net/audio/1790169562856-f7bd33ba-900c-450a-a2f8-aa25c1af78e3.mp3',lyrics:''},
{id:8,title:'Fireflies',artist:'Owl City',album:'Ocean Eyes',cover:'https://cdn.phototourl.com/member/2026-09-23-8582bb7c-206a-4f92-b92e-3ea43d51a80c.jpg',audio:'https://pdftourl.net/audio/1790179106868-f770c477-9343-4318-9f29-fef6ce1d7df9.mp3',lyrics:''},{id:9,title:'Surat Cinta Untuk Starla',artist:'Virgoun',album:'Surat Cinta Untuk Starla',cover:'https://cdn.phototourl.com/member/2026-09-23-d4520ea9-e682-42e5-b753-044458508f75.jpg',audio:'https://pdftourl.net/audio/1790179430323-43a27a00-3ef2-4d82-9822-8f621a70c8c1.mp3',lyrics:''},
{id:10,title:'Shape of My Heart',artist:'Backstreet Boys',album:'Shape of My Heart',cover:'https://cdn.phototourl.com/member/2026-09-23-01b596e0-ffb3-4746-8e07-6fafe427330a.jpg',audio:'https://pdftourl.net/audio/1790206996595-93325089-a5ce-4655-bb66-2bfb7870c7f3.mp3',lyrics:''},
{id:11,title:'Stay With Me',artist:'Miki Matsubara',album:'Stay With Me',cover:'https://cdn.phototourl.com/member/2026-09-23-232913f0-9674-423a-b23e-27e711ef773f.jpg',audio:'https://pdftourl.net/audio/1790207452309-6bec4b87-a0ed-45b2-9a34-7f05d71b8d3c.mp3',lyrics:''},
{id:12,title:'Hindia',artist:'Hindia',album:'Hindia',cover:'https://cdn.phototourl.com/member/2026-09-24-6686e868-d6a6-46d5-99a3-04a5d85d5874.jpg',audio:'https://pdftourl.net/audio/1790208463349-c4f27489-2fa5-4fcf-bc52-507338a7e613.mp3',lyrics:''},
{id:13,title:'Loves Rock',artist:'TV Girl',album:'Loves Rock',cover:'https://cdn.phototourl.com/member/2026-09-24-659636f2-299b-4b3e-9574-795e565ea416.webp',audio:'https://pdftourl.net/audio/1790213776735-c623dc9b-d879-44c3-9df2-8207c63d2c7a.mp3',lyrics:''},
{id:14,title:'Crying Lightning',artist:'Arctic Monkeys',album:'Humbug',cover:'https://cdn.phototourl.com/member/2026-09-24-b20d6b14-e080-42c8-8d24-141419a6d342.jpg',audio:'https://pdftourl.net/audio/1790213942829-acb98c04-8845-45c7-993b-5b52658838d0.mp3',lyrics:''}];
const $=id=>document.getElementById(id),audio=$('audio');let current=null,filter='all';
const favs=()=>JSON.parse(localStorage.zaksFavs||'[]');const recents=()=>JSON.parse(localStorage.zaksRecent||'[]');
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function time(s){if(!isFinite(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function render(){let q=$('search').value.toLowerCase(),list=songs.filter(s=>(filter==='all'||favs().includes(s.id))&&(`${s.title} ${s.artist}`.toLowerCase().includes(q)));$('count').textContent=list.length+' lagu';$('grid').innerHTML=list.length?list.map(s=>`<article class="card"><img class="cover" src="${s.cover}"><div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div><div class="actions"><button class="fav ${favs().includes(s.id)?'on':''}" onclick="toggleFav(${s.id})">${favs().includes(s.id)?'♥':'♡'}</button><button class="fav" onclick="addToPlaylist(${s.id})" title="Tambah ke playlist">＋</button><button class="play" onclick="playSong(${s.id})">▶</button></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">Tidak ada musik.</div>';let r=recents().map(id=>songs.find(s=>s.id===id)).filter(Boolean);$('recent').innerHTML=r.length?r.map(s=>`<div class="row"><img src="${s.cover}"><div class="info"><b>${esc(s.title)}</b><div class="artist">${esc(s.artist)}</div></div><button onclick="playSong(${s.id})">▶</button></div>`).join(''):'<div class="empty">Belum ada musik yang diputar.</div>'}

function playlists(){return JSON.parse(localStorage.zaksPlaylists||'[]')}
function savePlaylists(x){localStorage.zaksPlaylists=JSON.stringify(x)}
function createPlaylist(){let n=prompt('Nama playlist:');if(!n||!n.trim())return;let p=playlists();p.push({id:Date.now(),name:n.trim(),songs:[]});savePlaylists(p);renderPlaylists();showPlaylists()}
function addToPlaylist(id){let p=playlists();if(!p.length){createPlaylist();p=playlists()}if(!p.length)return;let menu=p.map((x,i)=>(i+1)+'. '+x.name).join('\n');let a=Number(prompt('Pilih nomor playlist:\n\n'+menu));if(a>=1&&a<=p.length){if(!p[a-1].songs.includes(id))p[a-1].songs.push(id);savePlaylists(p);renderPlaylists();alert('Lagu ditambahkan ke '+p[a-1].name)}}
function playPlaylist(id){let p=playlists().find(x=>x.id===id);if(p&&p.songs.length)playSong(p.songs[0])}
function deletePlaylist(id){if(confirm('Hapus playlist ini?')){savePlaylists(playlists().filter(x=>x.id!==id));renderPlaylists()}}
function removeFromPlaylist(pid,sid){let p=playlists();let x=p.find(a=>a.id===pid);if(x){x.songs=x.songs.filter(i=>i!==sid);savePlaylists(p);renderPlaylists()}}
function showPlaylists(){$('playlistBox').style.display='block';$('grid').parentElement.style.display='none';renderPlaylists()}
function renderPlaylists(){let box=$('playlists'),p=playlists();if(!p.length){box.innerHTML='<div class="empty">Belum ada playlist.</div>';return}box.innerHTML=p.map(x=>{let ss=x.songs.map(id=>songs.find(a=>a.id===id)).filter(Boolean);return `<div class="row"><div class="info"><b>${esc(x.name)}</b><div class="artist">${ss.length} lagu</div><div style="margin-top:7px">${ss.map(a=>`<span style="display:inline-block;background:#292929;border-radius:12px;padding:5px 8px;margin:2px;font-size:11px">${esc(a.title)} <button style="width:auto;height:auto;background:none;color:#aaa" onclick="removeFromPlaylist(${x.id},${a.id})">×</button></span>`).join('')||'<span style="color:#777;font-size:12px">Playlist kosong</span>'}</div></div><button onclick="playPlaylist(${x.id})">▶</button><button onclick="deletePlaylist(${x.id})">🗑</button></div>`}).join('')}
function toggleFav(id){let f=favs();localStorage.zaksFavs=JSON.stringify(f.includes(id)?f.filter(x=>x!==id):[...f,id]);render()}
const lyricStore=()=>JSON.parse(localStorage.zaksLyrics||'{}');
function getLyrics(id){let s=songs.find(x=>x.id===id);if(!s)return'';let x=lyricStore();return Object.prototype.hasOwnProperty.call(x,id)?x[id]:(s.lyrics||'')}
function openLyrics(){let s=songs.find(x=>x.id===current);if(!s){alert('Pilih lagu terlebih dahulu.');return}$('lyricsOverlay').classList.add('show');$('lyricsTitle').textContent=s.title;$('lyricsArtist').textContent=s.artist;$('lyricsText').textContent=getLyrics(s.id)||'Lirik belum ditambahkan. Kamu bisa menambahkan lirik yang kamu miliki dengan tombol Edit lirik.';$('lyricsInput').style.display='none';$('lyricsText').style.display='block';$('editLyrics').style.display='inline-block';$('cancelLyrics').style.display='none';$('saveLyrics').style.display='none'}
function editLyrics(){let s=songs.find(x=>x.id===current);if(!s)return;$('lyricsInput').value=getLyrics(s.id);$('lyricsInput').style.display='block';$('lyricsText').style.display='none';$('editLyrics').style.display='none';$('cancelLyrics').style.display='inline-block';$('saveLyrics').style.display='inline-block'}
function saveLyrics(){let s=songs.find(x=>x.id===current);if(!s)return;let x=lyricStore();x[s.id]=$('lyricsInput').value;localStorage.zaksLyrics=JSON.stringify(x);openLyrics()}
function closeLyrics(){$('lyricsOverlay').classList.remove('show')}
$('lyricsBtn').onclick=openLyrics;$('closeLyrics').onclick=closeLyrics;$('editLyrics').onclick=editLyrics;$('saveLyrics').onclick=saveLyrics;$('cancelLyrics').onclick=openLyrics;$('lyricsOverlay').onclick=e=>{if(e.target===$('lyricsOverlay'))closeLyrics()};
function playSong(id){let s=songs.find(x=>x.id===id);if(!s)return;current=id;audio.src=s.audio;audio.play().catch(()=>{});$('pc').src=s.cover;$('pt').textContent=s.title;$('pa').textContent=s.artist;$('play').textContent='⏸';let r=recents().filter(x=>x!==id);r.unshift(id);localStorage.zaksRecent=JSON.stringify(r.slice(0,8));render();if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:s.album,artwork:[{src:s.cover}]})}
function next(dir){let i=songs.findIndex(s=>s.id===current);i=(i+dir+songs.length)%songs.length;playSong(songs[i].id)}
$('play').onclick=()=>{if(!current)return playSong(songs[0].id);audio.paused?(audio.play(),$('play').textContent='⏸'):(audio.pause(),$('play').textContent='▶')};$('prev').onclick=()=>next(-1);$('next').onclick=()=>next(1);$('random').onclick=()=>playSong(songs[Math.floor(Math.random()*songs.length)].id);$('search').oninput=render;$('vol').oninput=e=>audio.volume=e.target.value;$('prog').oninput=e=>audio.duration&&(audio.currentTime=e.target.value/100*audio.duration);audio.ontimeupdate=()=>{$('cur').textContent=time(audio.currentTime);$('prog').value=audio.duration?audio.currentTime/audio.duration*100:0};audio.onloadedmetadata=()=>{$('dur').textContent=time(audio.duration)};audio.onplay=()=>{$('play').textContent='⏸'};audio.onpause=()=>{$('play').textContent='▶'};audio.onended=()=>next(1);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(filter==='playlists'){showPlaylists()}else{$('playlistBox').style.display='none';$('grid').parentElement.style.display='block';render()}});renderPlaylists();if('mediaSession'in navigator){navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause());navigator.mediaSession.setActionHandler('previoustrack',()=>next(-1));navigator.mediaSession.setActionHandler('nexttrack',()=>next(1))}render();
</script></body></html>
